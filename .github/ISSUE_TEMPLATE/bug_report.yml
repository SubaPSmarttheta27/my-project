name: "Bug Report"
description: "Report a defect, unexpected behavior, or regression"
title: "[BUG]: <Brief summary of defect>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report Template
        Please provide clear steps to reproduce and system details to help diagnose the issue.

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "Select the severity impact of this bug."
      options:
        - "Critical / Blocker (System down, data loss, release blocked)"
        - "Major (Core functionality impaired, no workaround)"
        - "Medium (Feature impaired, viable workaround exists)"
        - "Low (Minor cosmetic / non-blocking defect)"
    validations:
      required: true

  - type: input
    id: related_feature
    attributes:
      label: "Related Feature / Story"
      description: "Link the related Feature or Task if known (e.g., #25)."
      placeholder: "#<feature-or-task-number>"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the problem is."
      placeholder: "Describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: "Expected vs Actual Behavior"
      description: "What did you expect to happen, and what actually occurred?"
      placeholder: |
        **Expected:** ...
        **Actual:** ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS, browser/runtime version, environment (Local, Staging, Production), etc."
      placeholder: |
        - OS: [e.g. Windows 11, Ubuntu 22.04]
        - Browser / Runtime: [e.g. Chrome 120, Node v20]
        - Environment: [e.g. Staging, Production]
    validations:
      required: false

  - type: textarea
    id: logs_screenshots
    attributes:
      label: "Logs / Screenshots"
      description: "Paste stack traces, error console logs, or drag & drop screenshots."
      placeholder: "Paste relevant log snippets or error messages here..."
    validations:
      required: false
