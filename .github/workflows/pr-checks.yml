# Diagram steps: Feature branch -> Pull request (CI: lint, unit tests)
name: PR checks
on:
  pull_request:
    branches: [develop-2]

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature/123-short-name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "Branch '$BRANCH' must look like feature/123-login (123 = ticket/story id)"
            exit 1
          fi

  lint-and-unit-tests:
    name: lint-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Run unit tests
        run: pytest -m "not integration and not e2e"
